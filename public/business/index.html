<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="スペクシービジネス。文書作成の「ふみ」と表計算の「そろばん」。文書・表のデータはサーバーに送信せず、ブラウザ内に保存します。">
  <meta name="theme-color" content="#f7f8f4">
  <title>スペクシービジネス</title>
  <link rel="canonical" href="https://specsy-hub.com/business">
  <link rel="stylesheet" href="/business/style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="home-link" href="/">
        <svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="m11.5 5-5 5 5 5M7 10h9"/></svg>
        Specsy
      </a>
    </header>

    <main>
      <h1>スペクシービジネス</h1>

      <div class="privacy">
        <span class="privacy-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 4.5 6v5.5c0 4.2 2.8 7.3 7.5 9.5 4.7-2.2 7.5-5.3 7.5-9.5V6L12 3Z"/><path d="m8.5 12 2.3 2.3 4.7-4.8"/></svg>
        </span>
        <p>文書・表のデータはサーバーに送信しません。</p>
        <span class="storage-label">ブラウザ内に保存</span>
      </div>

      <div class="app-grid">
        <a class="app-card fumi" href="/fumi" aria-label="ふみ — 文書作成を開く">
          <div class="app-art" aria-hidden="true">
            <svg class="document-art" viewBox="0 0 160 176" fill="none">
              <path class="paper" d="M29 13h75l27 27v123H29V13Z"/>
              <path class="paper-fold" d="M104 13v27h27"/>
              <path class="paper-heading" d="M48 62h49"/>
              <path class="paper-line" d="M48 81h64M48 96h64M48 111h64M48 126h41"/>
            </svg>
          </div>
          <div class="app-detail">
            <div class="app-name">
              <h2>ふみ</h2>
              <p>文書作成</p>
            </div>
            <span class="open-label">開く <svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M4 10h11m-5-5 5 5-5 5"/></svg></span>
          </div>
        </a>

        <a class="app-card soroban" href="/soroban" aria-label="そろばん — 表計算を開く">
          <div class="app-art" aria-hidden="true">
            <svg class="spreadsheet-art" viewBox="0 0 190 160" fill="none">
              <rect class="paper" x="10" y="17" width="170" height="126" rx="7"/>
              <path class="sheet-heading" d="M17 17h156a7 7 0 0 1 7 7v24H10V24a7 7 0 0 1 7-7Z"/>
              <path class="sheet-grid" d="M10 48h170M10 79h170M10 110h170M52 48v95M95 48v95M137 48v95"/>
              <rect class="sheet-cell" x="95" y="79" width="42" height="31"/>
              <rect class="sheet-handle" x="134" y="107" width="6" height="6" rx="1"/>
            </svg>
          </div>
          <div class="app-detail">
            <div class="app-name">
              <h2>そろばん</h2>
              <p>表計算</p>
            </div>
            <span class="open-label">開く <svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M4 10h11m-5-5 5 5-5 5"/></svg></span>
          </div>
        </a>
      </div>
    </main>
  </div>
</body>
</html>
