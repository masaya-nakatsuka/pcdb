<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src blob:; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#295749">
  <meta name="description" content="ログイン不要の日本語表計算。自動で広がるテーブル、数式・シート間参照、オートフィル、フィルター、Excel入出力、自動保存、AI連携に対応。">
  <title>そろばん｜表計算</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta name="soroban-agent-api" content="1.5.0; WebMCP; window.soroban">
  <link rel="help" type="text/plain" href="./llms.txt" title="AI操作ガイド">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./ai-style.css">
  <link rel="stylesheet" href="./save-style.css">
  <link rel="stylesheet" href="./workspace-style.css">
  <link rel="stylesheet" href="./features-style.css">
  <link rel="stylesheet" href="./security-style.css">
</head>
<body data-agent-api="soroban-v1.4">
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 3v4m-2-2h4"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v6l-4 2v-8Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 15v5h16v-5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 15v5h16v-5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h7l2 2h9v13H3Z"/></symbol>
    <symbol id="i-template" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M10 9v12"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4.5 2.6c-1 .5-1.5 1.2-1.5 2.4m0 3h.01"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Zm-4 9 3 3 5-5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 10h10a6 6 0 0 1 0 12M4 10l6-6M4 10l6 6" transform="translate(0 -3)"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 7H10a6 6 0 0 0 0 12M20 7l-6-6M20 7l-6 6"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H3V8h18v9h-4M7 14h10v7H7Z"/><path d="M17 11h1"/></symbol>
    <symbol id="i-align-left" viewBox="0 0 24 24"><path d="M4 5h16M4 10h10M4 15h16M4 20h10"/></symbol>
    <symbol id="i-align-center" viewBox="0 0 24 24"><path d="M4 5h16M7 10h10M4 15h16M7 20h10"/></symbol>
    <symbol id="i-align-right" viewBox="0 0 24 24"><path d="M4 5h16M10 10h10M4 15h16M10 20h10"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5Z M14 3v6h5M8 13h8M8 17h8"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C7 2 1 11 7 17s15-1 13-14ZM5 20l11-12"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h9V3"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16M5.5 8h1M5.5 12h1M5.5 16h1"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 3v18m-4-4 4 4 4-4M15 5h6M15 11h4M15 17h2"/></symbol>
  </defs></svg>


  <div class="app-layout" id="workspace-app">
    <aside class="sidebar" id="book-sidebar" aria-label="ブック一覧" hidden>
      <div class="sidebar-heading"><strong>ブック一覧</strong><button class="icon-button" data-action="close-books" aria-label="ブック一覧を閉じる"><svg><use href="#i-close"/></svg></button></div>
      <button class="new-book-button" data-action="new"><svg><use href="#i-plus"/></svg>新しいブック<span>⌘ N</span></button>
      <nav class="side-nav" aria-label="ワークスペース"><button class="side-nav-item" data-action="templates"><svg><use href="#i-template"/></svg>テンプレート</button><button class="side-nav-item" data-action="import"><svg><use href="#i-upload"/></svg>ファイルを読み込む</button></nav>
      <div class="side-section-label">保存したブック<span id="book-count">1</span></div>
      <div class="book-list" id="book-list"></div>
      <div class="sidebar-bottom"><button class="auto-save-badge" id="auto-save-badge" data-action="storage-info" aria-label="自動保存と保存先の設定"><span class="tiny-dot"></span><span id="auto-save-label">自動保存 ON</span></button><button class="file-save-summary" data-action="storage-info"><svg><use href="#i-save"/></svg><span id="file-save-summary">ファイルの保存先を選ぶ</span></button><button class="sidebar-save-link" data-action="storage-info"><svg><use href="#i-save"/></svg><span>保存設定</span></button></div>
    </aside>
    <button class="sidebar-backdrop" id="sidebar-backdrop" data-action="close-books" aria-label="ブック一覧を閉じる" tabindex="-1" hidden></button>

    <main class="main-workspace" id="workspace">
      <section class="document-bar" aria-label="ブックの操作">
        <button class="tool-button" id="books-toggle" data-action="toggle-books" aria-label="ブック一覧を開く" aria-controls="book-sidebar" aria-expanded="false" title="ブック一覧を開く"><svg><use href="#i-panel"/></svg></button>
        <div class="document-title"><h1><button id="book-title" title="クリックしてブック名を変更">経費帳</button></h1><span class="sample-tag" id="sample-tag">サンプル</span></div>
        <div class="document-save-status" role="status" aria-label="保存の状態"><button class="document-save-trigger" data-action="storage-info" title="保存設定を開く"><span class="save-value" id="save-status"><span class="tiny-dot"></span>ブラウザに保存済み</span></button><span class="save-time" id="save-time">自動保存 ON</span></div>
        <div class="document-actions">
          <button class="ai-header-button" id="ai-guide-button" data-action="ai-guide" aria-label="AI連携と操作ガイド"><span>AI連携</span><i id="ai-ready-dot" aria-hidden="true"></i></button>
          <button class="icon-button document-help" data-action="help" aria-label="ヘルプ" title="ヘルプ"><svg><use href="#i-help"/></svg></button>
          <div class="export-wrap"><button class="button primary save-primary" data-action="save" id="save-book-button" title="ブックを保存（Ctrl / ⌘ S）"><svg><use href="#i-save"/></svg>保存</button><button class="button primary export-more save-primary" data-action="save-menu" aria-label="その他の保存方法"><svg><use href="#i-down"/></svg></button></div>
        </div>
      </section>

      <section class="sheet-card" aria-label="表計算エディター">
        <div class="menu-bar"><div class="menus"><button data-menu="file">ファイル</button><button data-menu="edit">編集</button><button data-menu="view">表示</button><button data-menu="insert">挿入</button><button data-menu="format">書式</button><button data-menu="data">データ</button><button data-menu="table">テーブル</button></div><span class="editing-indicator"><span></span>編集中</span></div>
        <div class="toolbar" role="toolbar" aria-label="セルの書式と操作">
          <div class="tool-group"><button class="tool-button" data-action="undo" id="undo-btn" title="元に戻す（Ctrl/⌘ Z）" aria-label="元に戻す"><svg><use href="#i-undo"/></svg></button><button class="tool-button" data-action="redo" id="redo-btn" title="やり直す（Ctrl/⌘ Shift Z）" aria-label="やり直す"><svg><use href="#i-redo"/></svg></button><button class="tool-button" data-action="print" title="印刷" aria-label="印刷"><svg><use href="#i-print"/></svg></button></div>
          <div class="tool-group"><label class="sr-only" for="font-family">フォント</label><select id="font-family" class="tool-select font-select"><option value="sans">標準ゴシック</option><option value="serif">明朝体</option><option value="mono">等幅</option></select><label class="sr-only" for="font-size">文字サイズ</label><select id="font-size" class="tool-select size-select"><option>11</option><option selected>13</option><option>14</option><option>16</option><option>18</option><option>20</option></select></div>
          <div class="tool-group"><button class="tool-button type-tool" data-format="bold" id="format-bold" title="太字（Ctrl/⌘ B）" aria-label="太字"><strong>B</strong></button><button class="tool-button type-tool" data-format="italic" id="format-italic" title="斜体" aria-label="斜体"><em>I</em></button><button class="tool-button type-tool" data-format="underline" id="format-underline" title="下線" aria-label="下線"><u>U</u></button><button class="tool-button color-tool" data-action="text-color" title="文字の色" aria-label="文字の色"><span>A</span><i id="text-color-bar"></i></button><button class="tool-button fill-tool" data-action="fill-color" title="背景の色" aria-label="背景の色"><span>▰</span><i id="fill-color-bar"></i></button></div>
          <div class="tool-group alignment-tools"><button class="tool-button" data-align="left" title="左揃え" aria-label="左揃え"><svg><use href="#i-align-left"/></svg></button><button class="tool-button" data-align="center" title="中央揃え" aria-label="中央揃え"><svg><use href="#i-align-center"/></svg></button><button class="tool-button" data-align="right" title="右揃え" aria-label="右揃え"><svg><use href="#i-align-right"/></svg></button></div>
          <div class="tool-group number-tools"><button class="tool-button type-tool" data-number-format="yen" title="円表示" aria-label="円表示">¥</button><button class="tool-button type-tool" data-number-format="percent" title="パーセント表示" aria-label="パーセント表示">%</button><button class="tool-button type-tool" data-number-format="number" title="桁区切り" aria-label="桁区切り">,</button></div>
          <div class="tool-group end-tools"><button class="tool-button sum-tool" data-action="autosum" title="選択した数値の下に合計を挿入" aria-label="合計を挿入">Σ</button><button class="tool-button" data-action="search" title="セルを検索（Ctrl/⌘ F）" aria-label="セルを検索"><svg><use href="#i-search"/></svg></button><button class="tool-button" data-action="sheet-menu" title="シートの操作" aria-label="シートの操作"><svg><use href="#i-more"/></svg></button></div>
        </div>
        <div class="formula-bar"><label class="sr-only" for="cell-address">セルの番地</label><input id="cell-address" value="F6" aria-label="セルの番地" spellcheck="false"><span class="formula-symbol">ƒx</span><label class="sr-only" for="formula-input">セルの値または数式</label><input id="formula-input" aria-label="セルの値または数式" placeholder="値や数式を入力（例：=SUM(A1:A10)）" autocomplete="off" spellcheck="false"><span id="formula-hint">Enter で確定</span></div>
        <div class="grid-wrap" id="grid-wrap" tabindex="0" role="region" aria-label="表計算グリッド。セルをクリックして入力、矢印キーで移動。"><table id="sheet-grid" class="sheet-grid" role="grid" aria-label="シート"><colgroup id="grid-cols"></colgroup><thead id="grid-head"></thead><tbody id="grid-body"></tbody></table><input id="cell-editor" class="cell-editor" type="text" aria-label="セルを編集" autocomplete="off" spellcheck="false" hidden></div>
        <div class="sheet-bottom"><div class="sheet-switcher"><button class="add-sheet icon-button" data-action="add-sheet" title="シートを追加" aria-label="シートを追加"><svg><use href="#i-plus"/></svg></button><span class="tab-divider"></span><div id="sheet-tabs" class="sheet-tabs" role="tablist" aria-label="シート"></div></div><button class="add-rows-button" data-action="add-rows">＋ 50行を追加</button></div>
        <div class="status-bar"><span class="selection-status"><span class="tiny-dot"></span><span id="selection-label">準備完了</span></span><span id="selection-stats"></span><div class="zoom-control"><button data-action="zoom-out" aria-label="縮小">−</button><button id="zoom-value" data-action="zoom-reset" title="100%に戻す">100%</button><button data-action="zoom-in" aria-label="拡大">＋</button></div></div>
      </section>
    </main>
  </div>
  <section class="vault-screen" id="vault-screen" aria-labelledby="vault-title" hidden>
    <div class="vault-card"><div class="vault-brand">そろばん</div><h1 id="vault-title">ロックされています</h1><p>パスワードで、このブラウザのブックを開きます。</p>
      <form id="vault-unlock-form"><label class="field-label" for="vault-unlock-password">パスワード</label><input class="text-input" id="vault-unlock-password" type="password" autocomplete="current-password" required maxlength="1024"><p id="vault-unlock-error" class="feature-inline-error" role="status"></p><button class="button primary" id="vault-unlock-submit" type="submit">ロックを解除</button></form>
      <button class="agent-text-button vault-backup" id="vault-locked-backup" type="button">暗号化データをバックアップ</button><p class="storage-footnote">パスワードは保存していません。忘れた場合、復旧できません。</p>
    </div>
  </section>
  <div class="task-panel" id="task-panel" role="status" aria-live="polite" hidden><span id="task-message"></span><button class="button subtle" id="task-cancel" type="button">中止</button></div>
  <input type="file" id="file-input" accept=".csv,.tsv,.txt,.json,.xlsx" hidden>
  <div id="popover" class="popover" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" class="modal"><div class="modal-header"><div><h2 id="modal-title"></h2></div><button class="icon-button" id="modal-close" aria-label="閉じる"><svg><use href="#i-close"/></svg></button></div><div id="modal-content"></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
